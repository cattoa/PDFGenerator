[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfgenerator"
version = "2.0.0"
description = "FastAPI service that fills HTML templates with tags and renders them to PDF via headless Chromium."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "playwright>=1.45",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.scripts]
pdfgenerator = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
